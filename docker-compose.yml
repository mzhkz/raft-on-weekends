networks:
  raft-common-network:
    driver: bridge
    ipam:
      config:
      - subnet: 10.0.0.0/24
      driver: default
services:
  client1:
    build: .
    command:
    - python
    - -m
    - client.run_client
    - --name
    - client1
    - --client
    - cca
    container_name: client1
    depends_on:
      node3:
        condition: service_started
    networks:
      raft-common-network:
        ipv4_address: 10.0.0.5
    ports:
    - 5558:8888/udp
    volumes:
    - ./dump:/app/dump
  client2:
    build: .
    command:
    - python
    - -m
    - client.run_client
    - --name
    - client2
    - --client
    - cca
    container_name: client2
    depends_on:
      node3:
        condition: service_started
    networks:
      raft-common-network:
        ipv4_address: 10.0.0.6
    ports:
    - 5559:8888/udp
    volumes:
    - ./dump:/app/dump
  client3:
    build: .
    command:
    - python
    - -m
    - client.run_client
    - --name
    - client3
    - --client
    - cca
    container_name: client3
    depends_on:
      node3:
        condition: service_started
    networks:
      raft-common-network:
        ipv4_address: 10.0.0.7
    ports:
    - 5560:8888/udp
    volumes:
    - ./dump:/app/dump
  node1:
    build: .
    command:
    - python
    - -m
    - raft.run_node
    - --node
    - 10.0.0.2
    - --cluster
    - node2,node3
    - --name
    - node1
    - --clients
    - client1,client2,client3
    - --state
    - cca
    - --duration
    - '20'
    container_name: node1
    environment:
    - NODE=node1
    - CLUSTER=node2,node3
    - CLIENTS=client1,client2,client3
    networks:
      raft-common-network:
        ipv4_address: 10.0.0.2
    ports:
    - 3333:8080/udp
    volumes:
    - ./dump:/app/dump
  node2:
    build: .
    command:
    - python
    - -m
    - raft.run_node
    - --node
    - 10.0.0.3
    - --cluster
    - node1,node3
    - --name
    - node2
    - --clients
    - client1,client2,client3
    - --state
    - cca
    - --duration
    - '20'
    container_name: node2
    environment:
    - NODE=node2
    - CLUSTER=node1,node3
    - CLIENTS=client1,client2,client3
    networks:
      raft-common-network:
        ipv4_address: 10.0.0.3
    ports:
    - 3334:8080/udp
    volumes:
    - ./dump:/app/dump
  node3:
    build: .
    command:
    - python
    - -m
    - raft.run_node
    - --node
    - 10.0.0.4
    - --cluster
    - node1,node2
    - --name
    - node3
    - --clients
    - client1,client2,client3
    - --state
    - cca
    - --duration
    - '20'
    container_name: node3
    environment:
    - NODE=node3
    - CLUSTER=node1,node2
    - CLIENTS=client1,client2,client3
    networks:
      raft-common-network:
        ipv4_address: 10.0.0.4
    ports:
    - 3335:8080/udp
    volumes:
    - ./dump:/app/dump
version: '3.8'
